# 1. Nombre de la aplicación
spring.application.name=servicio-estudiantes

# Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# 2. Configuración de la Base de Datos (Gasolina para el motor)
# El localhost:3306 es la dirección de tu Docker.
# db_estudiantes es el nombre de la base de datos que se creará.
spring.datasource.url=jdbc:mysql://localhost:3306/db_estudiantes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Configuración de Liquibase (El control de versiones de la BD)
# Aquí le decimos dónde está el "Director de Orquesta" que creamos antes.
spring.liquibase.change-log=classpath:db/changelog/maestro.xml
spring.liquibase.enabled=true

# 4. Mostrar el SQL en la consola (Para que veas lo que pasa por detrás)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
server.port=8081

# Logging
logging.file.name=logs/${spring.application.name}.log
logging.level.root=INFO
logging.level.com.duoc=DEBUG

# HTTP access logs (Tomcat)
server.tomcat.basedir=.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=${spring.application.name}-access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D
