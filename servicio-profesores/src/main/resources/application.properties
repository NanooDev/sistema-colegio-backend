# 1. Nombre y puerto
# Si ves "BindException: La dirección ya se está usando", otra JVM sigue usando el puerto:
#   fuser -k 8082/tcp
# O arranca en otro puerto y define la misma URL en servicio-cursos (feign.profesores.url):
#   PROFESORES_PORT=8092 ./mvnw spring-boot:run
spring.application.name=servicio-profesores
server.port=${PROFESORES_PORT:8082}

# Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# 2. Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/db_profesores?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Liquibase
spring.liquibase.change-log=classpath:db/changelog/maestro.xml
spring.liquibase.enabled=true

# 4. JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# Logging
logging.file.name=logs/${spring.application.name}.log
logging.level.root=INFO
logging.level.com.duoc=DEBUG

# HTTP access logs (Tomcat)
server.tomcat.basedir=.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=${spring.application.name}-access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D
