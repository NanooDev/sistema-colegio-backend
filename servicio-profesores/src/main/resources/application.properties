# 1. Nombre y Puerto
spring.application.name=servicio-profesores
server.port=8081

# 2. Configuraci�n de Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/db_profesores?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
