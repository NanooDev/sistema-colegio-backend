spring:
  application:
    name: servicio-matriculas
  datasource:
    url: jdbc:mysql://localhost:3306/db_matriculas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/maestro.xml
    enabled: true

server:
  port: 8086
  tomcat:
    basedir: .
    accesslog:
      enabled: true
      directory: logs
      prefix: ${spring.application.name}-access
      suffix: .log
      pattern: "%h %l %u %t \"%r\" %s %b %D"

feign:
  estudiantes:
    url: http://localhost:8081/api/v1/estudiantes
  cursos:
    url: http://localhost:8084/api/v1/cursos

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

logging:
  level:
    root: info
    com.duoc: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql-matriculas:3306/db_matriculas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/
