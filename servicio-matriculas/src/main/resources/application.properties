spring.application.name=servicio-matriculas
server.port=8086
spring.datasource.url=jdbc:mysql://localhost:3306/db_matriculas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.liquibase.change-log=classpath:db/changelog/maestro.xml
spring.liquibase.enabled=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
