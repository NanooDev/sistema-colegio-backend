# 1. Nombre de la aplicación
spring.application.name=biblioteca.salas.duoc

# Añadiendo propiedades de Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# 2. Configuración de la Base de Datos (Gasolina para el motor)
# El localhost:3306 es la dirección de tu Docker.
spring.datasource.url=jdbc:mysql://localhost:3306/db_biblioteca
spring.datasource.username=root
spring.datasource.password=root


spring.jpa.hibernate.ddl-auto=create-drop

# 4. Mostrar el SQL en la consola (Para que veas lo que pasa por detrás)
spring.jpa.show-sql=true
Spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

