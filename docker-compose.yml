    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-asignaturas:
    image: mysql:8.0
    container_name: mysql-servicio-asignaturas
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3315:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-matriculas:
    image: mysql:8.0
    container_name: mysql-servicio-matriculas
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3316:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-biblioteca:
    image: mysql:8.0
    container_name: mysql-servicio-biblioteca
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3317:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-finanzas:
    image: mysql:8.0
    container_name: mysql-servicio-finanzas
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3318:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-notificaciones:
    image: mysql:8.0
    container_name: mysql-servicio-notificaciones
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3319:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-calificaciones:
    image: mysql:8.0
    container_name: mysql-servicio-calificaciones
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3320:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- INFRAESTRUCTURA ---
  eureka:
    build: ./eureka
    container_name: eureka
    ports:
      - "8761:8761"
    networks:
      - microservicios-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - eureka
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SERVICIO_ESTUDIANTES_URL=http://servicio-estudiantes:8081
      - SERVICIO_PROFESORES_URL=http://servicio-profesores:8082
      - SERVICIO_ASISTENCIAS_URL=http://servicio-asistencias:8083
      - SERVICIO_CURSOS_URL=http://servicio-cursos:8084
      - SERVICIO_ASIGNATURAS_URL=http://servicio-asignaturas:8085
      - SERVICIO_MATRICULAS_URL=http://servicio-matriculas:8086
      - SERVICIO_BIBLIOTECA_URL=http://servicio-biblioteca:8087
      - SERVICIO_FINANZAS_URL=http://servicio-finanzas:8088
      - SERVICIO_NOTIFICACIONES_URL=http://servicio-notificaciones:8089
      - SERVICIO_CALIFICACIONES_URL=http://servicio-calificaciones:8095
    ports:
      - "8090:8090"
    networks:
      - microservicios-net

  # --- MICROSERVICIOS ---
  servicio-estudiantes:
    build: ./servicio-estudiantes
    container_name: servicio-estudiantes
    depends_on:
      mysql-servicio-estudiantes:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-servicio-estudiantes:3306/db_estudiantes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    ports:
      - "8081:8081"
    networks:
      - microservicios-net

  servicio-profesores:
    build: ./servicio-profesores
    container_name: servicio-profesores
    depends_on:
      mysql-servicio-profesores:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-servicio-profesores:3306/db_profesores?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    ports:
      - "8082:8082"
    networks:
      - microservicios-net

  servicio-asistencias:
    build: ./servicio-asistencias
    container_name: servicio-asistencias
    depends_on:
      mysql-servicio-asistencias:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-servicio-asistencias:3306/db_asistencias?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    ports:
      - "8083:8083"
    networks:
      - microservicios-net

  servicio-cursos:
    build: ./servicio-cursos
    container_name: servicio-cursos
    depends_on:
      mysql-servicio-cursos:
        condition: service_healthy
      eureka:
