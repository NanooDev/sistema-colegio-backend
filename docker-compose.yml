    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-asignaturas:
    image: mysql:8.0
    container_name: mysql-servicio-asignaturas
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3315:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-matriculas:
    image: mysql:8.0
    container_name: mysql-servicio-matriculas
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3316:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-biblioteca:
    image: mysql:8.0
    container_name: mysql-servicio-biblioteca
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3317:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-finanzas:
    image: mysql:8.0
    container_name: mysql-servicio-finanzas
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3318:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-notificaciones:
    image: mysql:8.0
    container_name: mysql-servicio-notificaciones
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3319:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-calificaciones:
    image: mysql:8.0
    container_name: mysql-servicio-calificaciones
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3320:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- INFRAESTRUCTURA ---
  eureka:
    build: ./eureka
    container_name: eureka
    ports:
      - "8761:8761"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      eureka:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8090:8090"
    networks:
      - microservicios-net

  # --- MICROSERVICIOS ---
  servicio-estudiantes:
    build: ./servicio-estudiantes
    container_name: servicio-estudiantes
    depends_on:
      mysql-servicio-estudiantes:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8081:8081"
    networks:
      - microservicios-net

  servicio-profesores:
    build: ./servicio-profesores
    container_name: servicio-profesores
    depends_on:
      mysql-servicio-profesores:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8082:8082"
    networks:
      - microservicios-net

  servicio-asistencias:
    build: ./servicio-asistencias
    container_name: servicio-asistencias
    depends_on:
      mysql-servicio-asistencias:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8083:8083"
    networks:
      - microservicios-net

  servicio-cursos:
    build: ./servicio-cursos
    container_name: servicio-cursos
    depends_on:
      mysql-servicio-cursos:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8084:8084"
    networks:
      - microservicios-net

  servicio-asignaturas:
    build: ./servicio-asignaturas
    container_name: servicio-asignaturas
    depends_on:
      mysql-servicio-asignaturas:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
