      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    ports:
      - "8084:8084"
    networks:
      - microservicios-net

  servicio-asignaturas:
    build: ./servicio-asignaturas
    container_name: servicio-asignaturas
    depends_on:
      mysql-servicio-asignaturas:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      - SERVER_PORT=8085
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-servicio-asignaturas:3306/db_asignaturas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
