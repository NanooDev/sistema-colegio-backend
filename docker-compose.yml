      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    ports:
      - "8087:8087"
    networks:
      - microservicios-net

  servicio-finanzas:
    build: ./servicio-finanzas
    container_name: servicio-finanzas
    depends_on:
      mysql-servicio-finanzas:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      - SERVER_PORT=8088
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-servicio-finanzas:3306/db_finanzas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
