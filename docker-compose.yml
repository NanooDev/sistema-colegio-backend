  servicio-notificaciones:
    build: ./servicio-notificaciones
    container_name: servicio-notificaciones
    depends_on:
      mysql-servicio-notificaciones:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8089:8089"
    networks:
      - microservicios-net

  servicio-calificaciones:
    build: ./servicio-calificaciones
    container_name: servicio-calificaciones
    depends_on:
      mysql-servicio-calificaciones:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8095:8095"
    networks:
      - microservicios-net
