version: '3.8'

networks:
  microservicios-net:
    driver: bridge

services:
  # --- BASES DE DATOS INDEPENDIENTES ---
  mysql-servicio-estudiantes:
    image: mysql:8.0
    container_name: mysql-servicio-estudiantes
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3311:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-profesores:
    image: mysql:8.0
    container_name: mysql-servicio-profesores
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3312:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-asistencias:
    image: mysql:8.0
    container_name: mysql-servicio-asistencias
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3313:3306"
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-servicio-cursos:
    image: mysql:8.0
