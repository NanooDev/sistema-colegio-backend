    depends_on:
      mysql-servicio-biblioteca:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8087:8087"
    networks:
      - microservicios-net

  servicio-finanzas:
    build: ./servicio-finanzas
    container_name: servicio-finanzas
    depends_on:
      mysql-servicio-finanzas:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
