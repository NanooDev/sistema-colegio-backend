      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    ports:
      - "8086:8086"
    networks:
      - microservicios-net

  servicio-biblioteca:
    build: ./servicio-biblioteca
    container_name: servicio-biblioteca
    depends_on:
      mysql-servicio-biblioteca:
