    ports:
      - "8085:8085"
    networks:
      - microservicios-net

  servicio-matriculas:
    build: ./servicio-matriculas
    container_name: servicio-matriculas
    depends_on:
      mysql-servicio-matriculas:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8086:8086"
    networks:
