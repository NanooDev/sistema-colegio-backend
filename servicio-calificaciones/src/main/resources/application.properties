# 1. Nombre de la aplicación
spring.application.name=servicio-calificaciones
server.port=8095

# Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# 2. Configuración de la Base de Datos (Gasolina para el motor)
# El localhost:3306 es la dirección de tu Docker.
spring.datasource.url=jdbc:mysql://localhost:3306/calificaciones?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

# 4. Mostrar el SQL en la consola (Para que veas lo que pasa por detrás)
spring.jpa.show-sql=true

# Logging

# HTTP access logs (Tomcat)
server.tomcat.basedir=.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=${spring.application.name}-access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D

eureka.client-service-url.defaultZone=http://localhost:8761/eureka/

springdoc.swagger-ui.path=/doc/swagger-ui.html

# Logging Configuration
logging.level.root=info
logging.level.com.duoc=info
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/${spring.application.name}.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
