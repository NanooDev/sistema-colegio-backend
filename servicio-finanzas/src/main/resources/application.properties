spring.application.name=servicio-finanzas
server.port=8088

# Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

spring.datasource.url=jdbc:mysql://localhost:3306/db_finanzas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.liquibase.change-log=classpath:db/changelog/maestro.xml
spring.liquibase.enabled=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# Logging
logging.file.name=logs/${spring.application.name}.log
logging.level.root=INFO
logging.level.com.duoc=DEBUG

# HTTP access logs (Tomcat)
server.tomcat.basedir=.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=${spring.application.name}-access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D
